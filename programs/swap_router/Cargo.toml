[package]
name = "swap-router"
version = "0.1.0"
description = "X1Factory Swap Router — fee routing + giga swap on X1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swap_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "0.28.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.28.0", features = ["token", "associated_token"] }
solana-program = "=1.16.27"
